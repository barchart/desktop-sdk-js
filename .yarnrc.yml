nodeLinker: node-modules

# Dependencies' install scripts (preinstall, install, postinstall) don't run: they're the usual way a compromised
# package runs code on a developer's machine or in CI. Nothing here needs one; a package that does gets an entry in
# dependenciesMeta in package.json with `built: true`.
enableScripts: false

# Our own package: released by us, so it doesn't need to wait out the age gate
npmPreapprovedPackages:
    - "@openfeed/sdk-js"
