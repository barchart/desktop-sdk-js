name: CI

# Read-only, with no secrets: pull requests run code nobody has reviewed yet. Actions are pinned to commit SHAs (a tag
# can be moved to other code); the comment names the version.
on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node }}
            # Yarn's version comes from packageManager in package.json
            - run: corepack enable
            # dependencies' install scripts are off (.yarnrc.yml)
            - run: yarn install --immutable
            # typecheck, lint, format, tests, build, and the package's exports and types (publint, attw)
            - run: yarn check

    commits:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
            - run: corepack enable
            - run: yarn install --immutable
            # the PR's commits are conventional commits (commitlint.config.js), for release-please
            - run: yarn commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
